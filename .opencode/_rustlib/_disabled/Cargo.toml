[package]
name = "assembler-core"
version = "0.1.0"
edition = "2021"
description = "Functional core for the AMANDA assembler — pure entity parsing, validation, ranking, and type routing"

[lib]
name = "assembler_core"
path = "src/lib.rs"

[[bin]]
name = "assemble"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
