[package]
name = "assembler-scripts"
version = "0.1.0"
edition = "2024"

[lib]
name = "assembler_scripts"
path = "src/lib.rs"

[[bin]]
name = "rust-lint"
path = "src/bin/rust_lint.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
glob = "0.3"

