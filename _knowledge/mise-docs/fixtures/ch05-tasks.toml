# ch05-tasks.toml — practice task config
# Source: mise.jdx.dev/tasks (2026-07-31), 2026.7.0
# Practice fixture — dependency chains, caching, usage args.

[tasks.lint]
run = "eslint ."
depends_post = ["postlint"]

[tasks.postlint]
run = "echo 'linting complete'"

[tasks.build]
run = "npm run build"
sources = ["package.json", "src/**", "!src/**/*.test.ts"]
outputs = ["dist", "!dist/**/*.map"]

[tasks.deploy]
usage = '''
arg "<environment>" help="Environment to deploy to"
flag "--force" help="Force deployment"
'''
depends = [
  { task = "build", args = ["--release"], env = { NODE_ENV = "production" } },
]
run = "deploy.sh ${usage_environment} ${usage_force:+--force}"

[tasks.monorepo-deploy]
depends = ["//packages/core:build"]
run = "echo monorepo deploy"

[task_config]
includes = [
  "git::ssh://git@github.com/myorg/shared-tasks.git//tasks?ref=v1.0.0",
]
