# ch01-mise.toml — practice config
# Source: mise.jdx.dev (2026-07-31), 2026.7.0
# Practice fixture — polyglot config with tools + env + tasks.

[tools]
node = "24"
python = "3.13"
rust = "1.85"

[env]
NODE_ENV = { default = "development" }
_.file = ".env.local"
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.dev]
description = "Run dev server"
run = "npm run dev"

[tasks.test]
description = "Run automated tests"
run = ["cargo test", "./scripts/test-e2e.sh"]

[tasks.build]
description = "Build the CLI"
run = "cargo build"
sources = ["Cargo.toml", "src/**/*.rs"]
outputs = ["target/debug/mycli"]
alias = "b"

[tasks.release]
description = "Cut a new release"
depends = ["test", "build"]
confirm = "Are you sure you want to cut a new release?"
run = "cargo publish"

[settings]
idiomatic_version_file_enable_tools = ['node']
