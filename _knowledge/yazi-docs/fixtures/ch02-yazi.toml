# ch02-yazi.toml — practice config
# Source: yazi-rs.github.io/docs/configuration/yazi (2026-07-31), 26.5.6
# Practice fixture — not a complete production config.

[mgr]
ratio = [1, 4, 3]          # parent / current / preview widths
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[preview]
max_width = 600
max_height = 900
image_filter = "lanczos3"
image_quality = 75

[opener]
edit = [
  { run = 'code %s', desc = "VSCode", for = "unix" },
]
open = [
  { run = 'xdg-open %s', desc = "Open", for = "unix" },
]
reveal = [
  { run = 'dolphin --select %s', desc = "Reveal in Dolphin", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = ["edit", "open", "reveal"] },
  { mime = "application/json", use = ["edit", "open", "reveal"] },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5

[plugin]
prepend_fetchers = [
  { id = "git", mime = "*", run = "git", prio = "normal", group = "file" },
  { id = "git", mime = "inode/directory", run = "git", prio = "normal", group = "dir" },
]
