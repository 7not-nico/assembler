whisper-edit:
  title: Direct whisper edit — cut phrases from chunk WAVs
  summary: Reads whisper JSON + chunk WAVs directly. Lists phrases, picks by index, composes. Bypasses revise-boundaries/extract. Works with any video.
  usage: whisper-edit <video>

full-edit:
  title: Direct full.wav edit — mix and match any phrases
  summary: Cuts phrases from full.wav using whisper JSON timestamps. Pick any subset, mix and match, one composition. Works with the current full.wav.
  usage: full-edit <video> [phrase-ids...]

